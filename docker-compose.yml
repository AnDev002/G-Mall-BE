version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gmall_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gmall
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis/redis-stack-server:latest
    container_name: gmall_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # wiki 0052: Qdrant vector DB cho image search.
  # ~100MB image, single container, no extra config needed.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: gmall_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # wiki 0052: CLIP encoder service (Python).
  # First boot downloads & bakes ~600MB of model weights -> image ~3GB.
  # Subsequent restarts are instant (model in image).
  clip:
    build: ./clip-service
    container_name: gmall_clip
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1500M

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
